name: Deploy WildLens frontend to GitHub Pages

# Builds the Vite app in ./frontend and publishes dist/ to GitHub Pages.
# This replaces the old "push static files straight to Pages" deploy —
# see frontend/README section "Deployment" for the Vercel/Netlify
# alternative if you'd rather skip Pages entirely.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Set to /<repo-name>/ for a project page (https://user.github.io/repo/).
          # Leave unset for a user/org page or a custom domain.
          BASE_PATH: /wild-lens/
          # Point this at your deployed FastAPI backend before going live —
          # see backend/README.md for deploy options. Falls back to
          # localhost:8000 if unset, which only works for local testing.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
