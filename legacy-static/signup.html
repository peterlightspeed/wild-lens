<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — WildLens</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://YOUR-USERNAME.github.io/wildlens/signup.html">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f0b">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .auth-card { width: 100%; max-width: 400px; background: var(--bg-elevated); border: 1px solid var(--line-strong); border-radius: var(--r-xl); padding: 36px 30px; box-shadow: var(--shadow-lg); }
  .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--ink-faint); font-size: 0.78rem; margin: 20px 0; }
  .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--line-strong); }
  .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: rgba(255,255,255,0.02); color: var(--ink-soft); font-weight: 700; font-size: 0.88rem; margin-bottom: 10px; transition: all .18s var(--ease); }
  .social-btn:hover { border-color: var(--accent); color: var(--ink); }
  .field-error { color: #e08a78; font-size: 0.8rem; margin-top: 6px; display: none; }
  .top-brand { position: absolute; top: 24px; left: 24px; }
</style>
</head>
<body>

<a href="index.html" class="wl-brand top-brand"><span class="wl-brand-mark"><i class="bi bi-leaf-fill"></i></span>WildLens</a>

<div class="auth-shell">
  <div class="auth-card">
    <span class="kicker"><span class="dot"></span> Join WildLens</span>
    <h1 class="mt-3 mb-2" style="font-size:1.7rem;">Create your account</h1>
    <p class="mb-4" style="font-size:0.92rem;">Free forever. Save identifications, post sightings, and get 50 AI Studio credits a month.</p>

    <button type="button" class="social-btn" onclick="WL.toast('Google sign-in coming soon')"><i class="bi bi-google"></i> Continue with Google</button>
    <button type="button" class="social-btn" onclick="WL.toast('Apple sign-in coming soon')"><i class="bi bi-apple"></i> Continue with Apple</button>

    <div class="auth-divider">or</div>

    <form id="signupForm" novalidate>
      <div class="field-group">
        <label class="field-label" for="fullName">Full name</label>
        <input class="wl-input" type="text" id="fullName" required autocomplete="name" placeholder="Jane Naturalist">
      </div>
      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <input class="wl-input" type="email" id="email" required autocomplete="email" placeholder="you@email.com">
      </div>
      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <input class="wl-input" type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="terms" required>
        <label class="form-check-label" for="terms" style="font-size:0.82rem; color:var(--ink-muted);">I agree to the <a href="#" style="color:var(--accent-bright);">Terms</a> and <a href="#" style="color:var(--accent-bright);">Privacy Policy</a></label>
      </div>
      <p class="field-error" id="formError"></p>
      <button type="submit" class="btn-wl btn-primary-wl w-100 mt-1" id="submitBtn"><i class="bi bi-person-plus"></i> Create Account</button>
    </form>

    <p class="text-center mt-4 mb-0" style="font-size:0.88rem;">Already have an account? <a href="login.html" style="color:var(--accent-bright); font-weight:700;">Sign in</a></p>
    <div class="text-center mt-3">
      <a href="index.html" style="font-size:0.85rem; color:var(--ink-faint);"><i class="bi bi-arrow-left"></i> Continue browsing as a guest</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  'use strict';
  function nextUrl() {
    var params = new URLSearchParams(location.search);
    return params.get('next') || 'index.html';
  }
  document.getElementById('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var errEl = document.getElementById('formError');
    var btn = document.getElementById('submitBtn');
    errEl.style.display = 'none';
    var fullName = document.getElementById('fullName').value.trim();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (password.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.';
      errEl.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Creating account…';
    try {
      await WL.auth.signup(fullName, email, password);
      WL.toast('Welcome to WildLens!');
      setTimeout(function () { location.href = nextUrl(); }, 400);
    } catch (err) {
      errEl.textContent = err.message || 'Could not reach the server. Is the API running?';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-person-plus"></i> Create Account';
    }
  });
})();
</script>
</body>
</html>
