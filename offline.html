<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline — WildLens</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .offline-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 32px; text-align:center; }
  .offline-icon { width:84px; height:84px; border-radius:50%; background:var(--bg-elevated); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; color:var(--ink-faint); font-size:2rem; }
</style>
</head>
<body>
  <div class="offline-wrap">
    <div style="max-width:420px;">
      <div class="offline-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 9L12 4L23 9M4 11V19C4 19.5523 4.44772 20 5 20H9M20 11V19C20 19.5523 19.5523 20 19 20H15M9 20V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V20M9 20H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 2L22 22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <span class="kicker"><span class="dot"></span> No Connection</span>
      <h1 class="mt-3" style="font-size:1.9rem;">You're off the trail</h1>
      <p class="lede mt-2">This page hasn't been cached yet. Reconnect to keep exploring — anything you've already visited will still work offline.</p>
      <button class="btn-wl btn-primary-wl mt-3" onclick="location.reload()">↻ Try Again</button>
      <div class="mt-4">
        <a href="index.html" class="wl-brand" style="justify-content:center; display:inline-flex;">
          <span class="wl-brand-mark"><svg width="18" height="18" viewBox="0 0 100 100"><path d="M30 66 Q34 30 76 24 Q72 62 30 66Z" fill="#06150d"/></svg></span> WildLens
        </a>
      </div>
    </div>
  </div>
</body>
</html>
